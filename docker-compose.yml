services:
  treasurehunt:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: treasurehunt-server
    depends_on:
      mongodb:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.treasurehunt-rtr.rule=Host(`treasurehunt.omnicade.eu`)"
      - "traefik.http.routers.treasurehunt-rtr.entrypoints=websecure"
      - "traefik.http.routers.treasurehunt-rtr.tls=true"
      - "traefik.http.routers.treasurehunt-rtr.tls.certresolver=letsencrypt"
      - "traefik.http.services.treasurehunt-svc.loadbalancer.server.port=${SERVER_PORT:-8080}"
      - "traefik.docker.network=dokploy-network"
    environment:
      - MONGO_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password123}@mongodb:27017/${DATABASE_NAME:-treasureHunt_auth}?authSource=admin
      - MONGO_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-password123}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-treasureHunt_auth}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - DATABASE_NAME=${DATABASE_NAME:-treasureHunt_auth}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/auth/google/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - treasurehunt-network
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${SERVER_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mongodb:
    image: mongo:7.0
    container_name: treasurehunt-mongodb
    command: mongod --quiet --logpath /dev/null
    volumes:
      - treasurehunt_mongodb_data_v0:/data/db
      - treasurehunt_mongodb_config_v0:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password123}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-treasureHunt_auth}
    networks:
      - treasurehunt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  treasurehunt_mongodb_data_v0:
    driver: local
  treasurehunt_mongodb_config_v0:
    driver: local

networks:
  treasurehunt-network:
    driver: bridge
  dokploy-network:
    external: true
